# .github/dependabot.yml
version: 2
updates:
  # App deps at repo root
  - package-ecosystem: "npm"      # change to "pip", "maven", etc., if not Node
    directory: "/"                # adjust if the app lives in a subfolder
    schedule:
      interval: "weekly"          # "daily" | "weekly" | "monthly"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"

  # Docker base images (optional)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
